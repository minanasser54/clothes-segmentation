[project]
name = "clothes-segmentation"
version = "1.0.0"
description = "Semantic segmentation model for separating worn clothing from people in images (Computer Vision Assignment CVCY002)"
readme = "README.md"
authors = [
    { name = "Mina Nasser", email = "mina.nasser54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.16",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "opencv-python>=4.9",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "kagglehub>=0.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "tensorboard>=2.16",
]

[tool.uv]
package = false
